<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Time — Cinema d'Animazione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0d16;
    --bg-panel:#151a2b;
    --bg-panel-2:#1c2338;
    --line:#2a3150;
    --gold:#f4b740;
    --gold-dim:#8a6a1f;
    --team1:#ff6b5b;
    --team1-dim:#4a2420;
    --team2:#37c6c0;
    --team2-dim:#1c3d3b;
    --text:#f5f3ea;
    --text-dim:#9aa0b9;
    --radius:20px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(244,183,64,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{ font-family:'Baloo 2',sans-serif; }
  .mono{ font-family:'JetBrains Mono',monospace; }

  /* ---------- LAYOUT SHELLS ---------- */
  #app{ flex:1; display:flex; flex-direction:column; min-height:100vh; }
  .center{ flex:1; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; }
  .stage{ flex:1; display:flex; flex-direction:column; padding:32px 40px 0; }
  .card-wrap{ flex:1; display:flex; flex-direction:column; }

  /* ---------- ROLE SELECT ---------- */
  .role-title{ font-size:clamp(32px,6vw,56px); color:var(--gold); text-shadow:0 0 30px rgba(244,183,64,0.35); }
  .role-sub{ color:var(--text-dim); margin-top:10px; font-size:16px; }
  .role-grid{ display:flex; gap:18px; margin-top:40px; flex-wrap:wrap; justify-content:center; }
  .role-btn{
    border:2px solid var(--line); background:var(--bg-panel); color:var(--text);
    border-radius:var(--radius); padding:26px 30px; min-width:200px;
    font-family:'Baloo 2',sans-serif; font-size:20px; font-weight:700; cursor:pointer;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .role-btn:hover{ transform:translateY(-3px); }
  .role-btn.presenter{ border-color:var(--gold); }
  .role-btn.presenter:hover{ background:rgba(244,183,64,0.08); }
  .role-btn.t1{ border-color:var(--team1); }
  .role-btn.t1:hover{ background:rgba(255,107,91,0.10); }
  .role-btn.t2{ border-color:var(--team2); }
  .role-btn.t2:hover{ background:rgba(55,198,192,0.10); }

  /* ---------- TOP BAR (presenter) ---------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding-bottom:18px; border-bottom:1px solid var(--line); }
  .eyebrow{ text-transform:uppercase; letter-spacing:.14em; font-size:12px; color:var(--gold); font-weight:700; }
  .round-name{ font-size:22px; margin-top:4px; }
  .qcount{ color:var(--text-dim); font-size:14px; }
  .reset-link{ background:none; border:none; color:var(--text-dim); font-size:13px; cursor:pointer; text-decoration:underline; }

  /* ---------- QUESTION PANEL ---------- */
  .qpanel{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px 0 30px; position:relative; }
  .spot{ position:absolute; inset:0; background:radial-gradient(420px 260px at 50% 40%, rgba(244,183,64,0.10), transparent 65%); pointer-events:none; }
  .qnum{ font-size:15px; color:var(--gold); font-weight:700; letter-spacing:.06em; margin-bottom:10px; }
  .qtext{ font-size:clamp(22px,3.2vw,36px); font-family:'Baloo 2',sans-serif; max-width:900px; line-height:1.25; }
  .qimg{ max-height:280px; max-width:90%; border-radius:14px; margin:22px 0; border:3px solid var(--line); object-fit:cover; }
  .opts{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:26px; width:100%; max-width:820px; }
  .opt{ background:var(--bg-panel); border:2px solid var(--line); border-radius:14px; padding:16px 20px; text-align:left; font-size:17px; display:flex; gap:12px; }
  .opt .letter{ font-family:'Baloo 2',sans-serif; color:var(--gold); font-weight:700; }
  .opt.correct{ border-color:#5fd68a; background:rgba(95,214,138,0.10); }
  .opt.wrong-marked{ border-color:var(--team1); opacity:.5; }

  .img-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:20px; max-width:820px; width:100%; }
  .img-opt{ background:var(--bg-panel); border:2px solid var(--line); border-radius:14px; padding:10px; text-align:center; }
  .img-opt img{ width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; }
  .img-opt .letter{ margin-top:8px; font-family:'Baloo 2',sans-serif; color:var(--gold); font-weight:700; }
  .img-opt.correct{ border-color:#5fd68a; }

  .assoc-cols{ display:flex; gap:60px; margin-top:20px; text-align:left; }
  .assoc-col h4{ color:var(--gold); font-size:14px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:10px; }
  .assoc-col ol{ padding-left:20px; font-size:17px; line-height:1.9; }

  /* ---------- SUBMISSION STATUS (presenter) ---------- */
  .submit-status{ display:flex; gap:16px; justify-content:center; margin-top:22px; }
  .pill{ padding:10px 18px; border-radius:999px; font-weight:700; font-size:14px; border:2px solid var(--line); }
  .pill.t1{ border-color:var(--team1); }
  .pill.t1.on{ background:rgba(255,107,91,0.18); }
  .pill.t2{ border-color:var(--team2); }
  .pill.t2.on{ background:rgba(55,198,192,0.18); }

  /* ---------- REVEAL ANSWER PANELS ---------- */
  .answer-panels{ display:flex; gap:20px; margin-top:24px; width:100%; max-width:820px; flex-wrap:wrap; justify-content:center; }
  .ans-card{ flex:1; min-width:260px; background:var(--bg-panel); border-radius:14px; padding:18px 20px; border:2px solid var(--line); text-align:left; }
  .ans-card.t1{ border-color:var(--team1); }
  .ans-card.t2{ border-color:var(--team2); }
  .ans-card h5{ font-family:'Baloo 2',sans-serif; margin-bottom:8px; }
  .ans-card .val{ font-size:16px; color:var(--text-dim); }
  .grade-btns{ display:flex; gap:8px; margin-top:12px; }
  .grade-btns button{ flex:1; padding:9px; border-radius:10px; border:2px solid var(--line); background:transparent; color:var(--text); font-weight:700; cursor:pointer; font-family:'Inter',sans-serif; }
  .grade-btns button.pick-ok.active{ background:#1f4a30; border-color:#5fd68a; color:#c9f5d6; }
  .grade-btns button.pick-no.active{ background:#4a2020; border-color:var(--team1); color:#ffd6d0; }
  .status-tag{ display:inline-block; margin-top:6px; font-size:13px; font-weight:700; padding:3px 10px; border-radius:999px; }
  .status-tag.ok{ background:#1f4a30; color:#c9f5d6; }
  .status-tag.no{ background:#4a2020; color:#ffd6d0; }

  /* ---------- CONTROLS ---------- */
  .controls{ display:flex; justify-content:center; gap:14px; padding:22px 0 32px; flex-wrap:wrap; }
  .btn{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16px; padding:14px 28px; border-radius:14px; border:none; cursor:pointer; transition:transform .12s ease; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--gold); color:#241a03; }
  .btn-ghost{ background:transparent; border:2px solid var(--line); color:var(--text); }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }

  /* ---------- SCOREBOARD BAR (presenter) ---------- */
  .scorebar{ display:flex; border-top:1px solid var(--line); }
  .score-side{ flex:1; padding:18px 26px; display:flex; align-items:center; justify-content:space-between; }
  .score-side.t1{ background:linear-gradient(90deg, rgba(255,107,91,0.12), transparent); }
  .score-side.t2{ background:linear-gradient(270deg, rgba(55,198,192,0.12), transparent); flex-direction:row-reverse; }
  .score-name{ font-family:'Baloo 2',sans-serif; font-size:16px; }
  .score-side.t1 .score-name{ color:var(--team1); }
  .score-side.t2 .score-name{ color:var(--team2); }
  .score-num{ font-family:'JetBrains Mono',monospace; font-size:34px; font-weight:700; }
  .pulse{ animation:pulse .6s ease; }
  @keyframes pulse{ 0%{ transform:scale(1);} 40%{ transform:scale(1.18);} 100%{ transform:scale(1);} }

  /* ---------- SCOREBOARD / END SCREENS ---------- */
  .big-scores{ display:flex; gap:40px; margin-top:36px; }
  .score-block{ text-align:center; }
  .score-block .n{ font-family:'JetBrains Mono',monospace; font-size:64px; font-weight:700; }
  .score-block.t1 .n{ color:var(--team1); }
  .score-block.t2 .n{ color:var(--team2); }
  .score-block .l{ margin-top:6px; color:var(--text-dim); font-size:14px; text-transform:uppercase; letter-spacing:.08em; }
  .winner{ margin-top:26px; font-size:26px; color:var(--gold); font-family:'Baloo 2',sans-serif; }

  /* ---------- TEAM VIEW ---------- */
  .team-shell{ max-width:560px; margin:0 auto; width:100%; padding:20px; flex:1; display:flex; flex-direction:column; }
  .team-badge{ align-self:flex-start; padding:6px 14px; border-radius:999px; font-weight:700; font-size:13px; margin-bottom:18px; }
  .team-badge.t1{ background:var(--team1-dim); color:var(--team1); border:1px solid var(--team1); }
  .team-badge.t2{ background:var(--team2-dim); color:var(--team2); border:1px solid var(--team2); }
  .team-q{ font-size:22px; font-family:'Baloo 2',sans-serif; line-height:1.3; margin-bottom:6px; }
  .team-round{ color:var(--text-dim); font-size:13px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; }
  .team-opts{ display:flex; flex-direction:column; gap:10px; margin-top:18px; }
  .team-opt{ background:var(--bg-panel); border:2px solid var(--line); border-radius:14px; padding:16px; text-align:left; font-size:16px; display:flex; gap:10px; }
  .team-opt input{ transform:scale(1.3); accent-color:var(--gold); }
  .team-opt.selected{ border-color:var(--gold); background:rgba(244,183,64,0.08); }
  .team-img{ width:100%; max-height:240px; object-fit:cover; border-radius:14px; margin:14px 0; }
  .team-text-input{ margin-top:16px; width:100%; padding:14px; border-radius:12px; border:2px solid var(--line); background:var(--bg-panel); color:var(--text); font-size:16px; }
  .team-text-input:focus{ outline:none; border-color:var(--gold); }
  .assoc-row{ background:var(--bg-panel); border:2px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .assoc-row label{ font-size:14px; color:var(--text-dim); display:block; margin-bottom:6px; }
  .assoc-row select{ width:100%; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--bg-panel-2); color:var(--text); font-size:15px; }
  .waiting{ text-align:center; padding:60px 20px; color:var(--text-dim); }
  .waiting .dot{ display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--gold); margin:0 3px; animation:blink 1.2s infinite; }
  .waiting .dot:nth-child(2){ animation-delay:.2s;} .waiting .dot:nth-child(3){ animation-delay:.4s;}
  @keyframes blink{ 0%,80%,100%{opacity:.2;} 40%{opacity:1;} }
  .confirm{ text-align:center; padding:50px 20px; }
  .confirm .check{ font-size:52px; }
  .confirm h3{ margin-top:14px; font-family:'Baloo 2',sans-serif; color:#5fd68a; }
  .team-score-strip{ display:flex; justify-content:space-between; margin-top:auto; padding-top:18px; border-top:1px solid var(--line); font-family:'JetBrains Mono',monospace; }

  footer.credit{ text-align:center; color:var(--text-dim); font-size:12px; padding:14px; }

  @media (max-width:720px){
    .stage{ padding:20px 18px 0; }
    .opts{ grid-template-columns:1fr; }
    .img-grid{ grid-template-columns:repeat(2,1fr); }
    .assoc-cols{ flex-direction:column; gap:20px; }
    .answer-panels{ flex-direction:column; }
    .big-scores{ gap:24px; }
    .score-block .n{ font-size:44px; }
  }
</style>
</head>

  ]

const LETTERS = ["A","B","C","D"];

/* ---------- fuzzy text matching (accents/apostrophes/case/typo tolerant) ---------- */
function normalizeText(s){
  return (s||"")
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'') // strip accents
    .toLowerCase()
    .replace(/['’`.,\-\/]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function levenshtein(a,b){
  const m=a.length, n=b.length;
  if(m===0) return n; if(n===0) return m;
  const dp = Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}
function fuzzyMatch(input, aliases){
  const norm = normalizeText(input);
  if(!norm) return false;
  for(const alias of aliases){
    const a = normalizeText(alias);
    if(norm === a) return true;
    const maxDist = a.length > 8 ? 2 : (a.length > 3 ? 1 : 0);
    if(levenshtein(norm, a) <= maxDist) return true;
  }
  return false;
}

// Build a flat ordered list of "rounds" with question counts
const ROUNDS = [
  {key:"mc", title:"Domande a risposta multipla", rule:"+1 punto per risposta corretta, 0 per risposta sbagliata.", count: QUIZ.mc.length},
  {key:"categorize", title:"Classifica i titoli", rule:"+1 punto per ogni titolo classificato correttamente (max 20), 0 per ogni errore.", count:1},
  {key:"images", title:"Immagini", rule:"+1 punto per risposta corretta, -1 per risposta sbagliata (per ciascun campo).", count: QUIZ.images.length}
];

/* ============================================================
   STORAGE HELPERS — Firebase Realtime Database (REST API)
   Works from any static host, no login required by end users.
   ============================================================ */
// TODO: paste your Firebase Realtime Database URL here, e.g.
// "https://quiz-storia-default-rtdb.europe-west1.firebasedatabase.app"
const FIREBASE_DB_URL = "https://quiz-45b23-default-rtdb.europe-west1.firebasedatabase.app";

function fbPath(key){
  // Firebase REST paths can't contain '.', '#', '$', '[', ']' — sanitize keys
  const safe = key.replace(/[.#$\[\]]/g, '_');
  return `${FIREBASE_DB_URL}/quizdata/${safe}.json`;
}
async function getShared(key, fallback){
  try{
    const res = await fetch(fbPath(key));
    if(!res.ok) return fallback;
    const data = await res.json();
    return (data === null || data === undefined) ? fallback : data;
  }catch(e){ return fallback; }
}
async function setShared(key, value){
  try{
    await fetch(fbPath(key), {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(value)
    });
  }catch(e){ console.error(e); }
}
async function deleteSharedPrefix(prefix){
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/quizdata.json`);
    if(!res.ok) return;
    const all = await res.json();
    if(!all) return;
    const deletions = Object.keys(all).filter(k => k.startsWith(prefix.replace(/[.#$\[\]]/g,'_')))
      .map(k => fetch(`${FIREBASE_DB_URL}/quizdata/${k}.json`, {method:'DELETE'}));
    await Promise.all(deletions);
  }catch(e){ /* ignore */ }
}

const QKEY = (r,q) => `answers:${r}-${q}`;
const GKEY = (r,q) => `grades:${r}-${q}`;

async function getState(){ return await getShared("session-state", {phase:"lobby", roundIdx:0, questionIdx:0}); }
async function setState(s){ await setShared("session-state", s); }
async function getScores(){ return await getShared("scores", {team1:0, team2:0}); }
async function setScores(s){ await setShared("scores", s); }

/* ============================================================
   WIKIPEDIA IMAGE LOADER (client-side, cached)
   ============================================================ */
const imgCache = {};
async function fetchWikiImage(titleIt, titleEn){
  const cacheKey = titleIt + "|" + (titleEn||"");
  if(imgCache[cacheKey]) return imgCache[cacheKey];
  const tryFetch = async (lang, title) => {
    try{
      const res = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
      if(!res.ok) return null;
      const data = await res.json();
      return (data.thumbnail && data.thumbnail.source) ? data.thumbnail.source : (data.originalimage ? data.originalimage.source : null);
    }catch(e){ return null; }
  };
  let url = await tryFetch("it", titleIt);
  if(!url && titleEn) url = await tryFetch("en", titleEn);
  if(!url) url = await tryFetch("en", titleIt);
  imgCache[cacheKey] = url;
  return url;
}
function setImgWhenReady(imgEl, titleIt, titleEn){
  if(!imgEl) return;
  fetchWikiImage(titleIt, titleEn).then(url=>{
    if(url) imgEl.src = url;
    else imgEl.replaceWith(Object.assign(document.createElement('div'), {
      textContent: "🖼️ immagine non trovata — " + titleIt,
      style: "padding:30px; color:var(--text-dim); font-size:14px;"
    }));
  });
}

}

async function renderPresenter(){
  const state = await getState();
  const scores = await getScores();
  const key = JSON.stringify(state)+JSON.stringify(scores);
  if(key === lastRenderedKey) return; // nothing changed, skip re-render (avoids flicker while presenter is mid-click)
  lastRenderedKey = key;

  if(state.phase === "lobby") return renderPresenterLobby(scores);
  if(state.phase === "round-intro") return renderPresenterRoundIntro(state, scores);
  if(state.phase === "question") return renderPresenterQuestion(state, scores);
  if(state.phase === "reveal") return renderPresenterReveal(state, scores);
  if(state.phase === "scoreboard") return renderPresenterScoreboard(state, scores);
  if(state.phase === "end") return renderPresenterEnd(scores);
}

async function gradeAndReveal(state, round){
  const ans = await getShared(QKEY(state.roundIdx, state.questionIdx), {});
  let scores = await getScores();

  if(round.key === "mc"){
    const q = QUIZ.mc[state.questionIdx];
    const grade = {};
    ['team1','team2'].forEach(t=>{
      if(ans[t] !== undefined){
        grade[t] = ans[t] === q.correct ? 'correct' : 'wrong';
        if(grade[t]==='correct') scores[t] = (scores[t]||0) + 1;
      }
    });
    await setShared(GKEY(state.roundIdx,state.questionIdx), grade);
    await setScores(scores);
  } else if(round.key === "categorize"){
    const grade = {};
    ['team1','team2'].forEach(t=>{
      if(ans[t]){
        let correctCount = 0;
        QUIZ.categorize.items.forEach((it,i)=>{ if(ans[t][i] === it.correct) correctCount++; });
        grade[t] = correctCount;
        scores[t] = (scores[t]||0) + correctCount;
      }
    });
    await setShared(GKEY(state.roundIdx,state.questionIdx), grade);
    await setScores(scores);
  } else if(round.key === "images"){
    const p = QUIZ.images[state.questionIdx];
    const grade = {};
    ['team1','team2'].forEach(t=>{
      if(ans[t]){
        const nameOk = fuzzyMatch(ans[t].name, p.nameAliases);
        const countryOk = fuzzyMatch(ans[t].country, p.countryAliases);
        grade[t] = { name: nameOk?'correct':'wrong', country: countryOk?'correct':'wrong' };
        scores[t] = (scores[t]||0) + (nameOk?1:-1) + (countryOk?1:-1);
      }
    });
    await setShared(GKEY(state.roundIdx,state.questionIdx), grade);
    await setScores(scores);
  }

  await setState({...state, phase:"reveal"});
  lastRenderedKey=""; renderPresenter();
}

async function renderPresenterReveal(state, scores){
  const round = ROUNDS[state.roundIdx];
  const ans = await getShared(QKEY(state.roundIdx, state.questionIdx), {});
  const grade = await getShared(GKEY(state.roundIdx, state.questionIdx), {});
  let bodyHTML = "", extraHTML = "";

  if(round.key === "mc"){
    const q = QUIZ.mc[state.questionIdx];
    bodyHTML = `
      <div class="qnum">RISPOSTA CORRETTA</div>
      <div class="qtext display">${q.q}</div>
      ${q.opts ? `<div class="opts">${q.opts.map((o,i)=>`<div class="opt ${i===q.correct?'correct':''}"><span class="letter">${LETTERS[i]}</span><span>${o}</span></div>`).join('')}</div>` : ''}
      ${q.imgOptions ? `<div class="img-grid">${q.imgOptions.map((o,i)=>`<div class="img-opt ${i===q.correct?'correct':''}"><img id="imgopt-${i}"><div class="letter">${LETTERS[i]} · ${o.label}</div></div>`).join('')}</div>` : ''}
    `;
    extraHTML = `
      <div class="answer-panels">
        ${['team1','team2'].map(t=>`
          <div class="ans-card ${t==='team1'?'t1':'t2'}">
            <h5>${t==='team1'?'🔴 Squadra 1':'🔵 Squadra 2'}</h5>
            <div class="val">${ans[t]!==undefined ? 'Risposta: '+LETTERS[ans[t]] : 'Nessuna risposta inviata'}</div>
            ${grade[t] ? `<span class="status-tag ${grade[t]==='correct'?'ok':'no'}">${grade[t]==='correct'?'✔ Corretto':'✘ Sbagliato'}</span>` : ''}
          </div>`).join('')}
      </div>`;
    setTimeout(()=>{ if(q.imgOptions) q.imgOptions.forEach((o,i)=> setImgWhenReady(document.getElementById(`imgopt-${i}`), o.wiki_it)); }, 0);
  } else if(round.key === "categorize"){
    bodyHTML = `
      <div class="qnum">SOLUZIONI</div>
      <div class="qtext display" style="font-size:22px;">Classificazione corretta</div>
      <div class="assoc-cols">
        <div class="assoc-col"><h4>${QUIZ.categorize.categoryA}</h4><ol>${QUIZ.categorize.items.filter(it=>it.correct==='A').map(it=>`<li>${it.title}</li>`).join('')}</ol></div>
        <div class="assoc-col"><h4>${QUIZ.categorize.categoryB}</h4><ol>${QUIZ.categorize.items.filter(it=>it.correct==='B').map(it=>`<li>${it.title}</li>`).join('')}</ol></div>
      </div>`;
    extraHTML = `
      <div class="answer-panels">
        ${['team1','team2'].map(t=>`
          <div class="ans-card ${t==='team1'?'t1':'t2'}">
            <h5>${t==='team1'?'🔴 Squadra 1':'🔵 Squadra 2'}</h5>
            <div class="val">${grade[t]!==undefined ? `${grade[t]} / 20 corrette` : 'Nessuna risposta inviata'}</div>
          </div>`).join('')}
      </div>`;
  } else if(round.key === "images"){
    const p = QUIZ.images[state.questionIdx];
    bodyHTML = `
      <div class="qnum">SOLUZIONE</div>
      <img class="qimg" id="hist-img-reveal">
      <div class="qtext display" style="font-size:26px;">${p.name}, ${p.country}</div>
    `;
    setTimeout(()=> setImgWhenReady(document.getElementById('hist-img-reveal'), p.wiki_it), 0);
    extraHTML = `
      <div class="answer-panels">
        ${['team1','team2'].map(t=>{
          if(!ans[t]) return `<div class="ans-card ${t==='team1'?'t1':'t2'}"><h5>${t==='team1'?'🔴 Squadra 1':'🔵 Squadra 2'}</h5><div class="val">Nessuna risposta inviata</div></div>`;
          const g = grade[t] || {name:null, country:null};
          return `
          <div class="ans-card ${t==='team1'?'t1':'t2'}">
            <h5>${t==='team1'?'🔴 Squadra 1':'🔵 Squadra 2'}</h5>
            <div class="val">Film: "${ans[t].name||''}"</div>
            <div class="grade-btns">
              <button class="pick-ok ${g.name==='correct'?'active':''}" data-team="${t}" data-field="name" data-verdict="correct">✔ Film ok</button>
              <button class="pick-no ${g.name==='wrong'?'active':''}" data-team="${t}" data-field="name" data-verdict="wrong">✘ Film no</button>
            </div>
            <div class="val" style="margin-top:10px;">Personaggio: "${ans[t].country||''}"</div>
            <div class="grade-btns">
              <button class="pick-ok ${g.country==='correct'?'active':''}" data-team="${t}" data-field="country" data-verdict="correct">✔ Personaggio ok</button>
              <button class="pick-no ${g.country==='wrong'?'active':''}" data-team="${t}" data-field="country" data-verdict="wrong">✘ Personaggio no</button>
            </div>
          </div>`;
        }).join('')}
      </div>`;
  }

  const isLastQInRound = (round.key==='mc' && state.questionIdx===QUIZ.mc.length-1) ||
                          (round.key==='categorize') ||
                          (round.key==='images' && state.questionIdx===QUIZ.images.length-1);
  const isLastRound = state.roundIdx === ROUNDS.length-1;
  const nextLabel = isLastQInRound ? (isLastRound ? 'Vedi risultati finali 🏁' : 'Prossimo round ▶') : 'Prossima domanda ▶';

  app.innerHTML = `
    <div class="stage">
      <div class="topbar">
        <div><div class="eyebrow">Round ${state.roundIdx+1} · ${round.title}</div><div class="round-name display">Correzione</div></div>
        <button class="reset-link" id="reset-btn">azzera partita</button>
      </div>
      <div class="qpanel"><div class="spot"></div>${bodyHTML}${extraHTML}</div>
      <div class="controls"><button class="btn btn-primary" id="next-btn">${nextLabel}</button></div>
      ${scorebarHTML(scores)}
    </div>`;

  if(round.key === "mc"){
    const q = QUIZ.mc[state.questionIdx];
    if(q.img) setImgWhenReady(document.querySelector('#mc-img'), q.img.wiki_it, q.img.wiki_en);
  }

  document.getElementById('reset-btn').onclick = resetGame;

  app.querySelectorAll('.grade-btns button').forEach(btn=>{
    btn.onclick = async ()=>{
      const team = btn.dataset.team, verdict = btn.dataset.verdict, field = btn.dataset.field;
      const currentGrade = await getShared(GKEY(state.roundIdx,state.questionIdx), {});
      let s = await getScores();
      if(field){
        // images round: per-field (name / country) verdicts
        if(!currentGrade[team]) currentGrade[team] = {name:null, country:null};
        const prev = currentGrade[team][field];
        if(prev === 'correct') s[team] -= 1;
        if(prev === 'wrong') s[team] += 1;
        currentGrade[team][field] = verdict;
        s[team] += (verdict==='correct' ? 1 : -1);
      } else {
        // mc round: single verdict for the whole answer
        if(currentGrade[team] === 'correct') s[team] -= 1;
        if(currentGrade[team] === 'wrong') s[team] += 1;
        currentGrade[team] = verdict;
        s[team] += (verdict==='correct' ? 1 : -1);
      }
      await setShared(GKEY(state.roundIdx,state.questionIdx), currentGrade);
      await setScores(s);
      lastRenderedKey=""; renderPresenter();
    };
  });

  document.getElementById('next-btn').onclick = async ()=>{
    if(!isLastQInRound){
      await setState({phase:"question", roundIdx:state.roundIdx, questionIdx: state.questionIdx+1});
    } else if(!isLastRound){
      await setState({phase:"scoreboard", roundIdx:state.roundIdx, questionIdx:0, nextRoundIdx: state.roundIdx+1});
    } else {
      await setState({phase:"end", roundIdx:state.roundIdx, questionIdx:0});
    }
    lastRenderedKey=""; renderPresenter();
  };
}

        </div>
        <div class="winner">${winner}</div>
        <div class="controls"><button class="btn btn-ghost" id="restart-btn">Nuova partita</button></div>
      </div>
    </div>`;
  document.getElementById('restart-btn').onclick = resetGame;
}

/* ============================================================
   TEAM VIEW
   ============================================================ */
let teamSubmittedFor = ""; // tracks "roundIdx-questionIdx" already submitted this session
let teamLastKey = "";       // last (phase-round-question) we fully rendered
let teamInputActive = false; // true while an unsubmitted answer form is on screen

async function renderTeam(force){
  const state = await getState();
  const key = `${state.phase}-${state.roundIdx}-${state.questionIdx}`;

  // Skip the automatic poll re-render while the person is actively filling in
  // an answer (radio/select/text) — otherwise it gets wiped every ~1.2s before
  // they can hit "Invia". Manual actions (button clicks) always pass force=true.
  if(!force && teamInputActive && key === teamLastKey){
    return;
  }
  teamLastKey = key;
  if(state.phase !== "question"){ teamInputActive = false; }

  const scores = await getScores();
  const teamKey = ROLE; // 'team1' | 'team2'
  const badgeClass = ROLE === 'team1' ? 't1' : 't2';
  const badgeLabel = ROLE === 'team1' ? '🔴 Squadra 1' : '🔵 Squadra 2';

  const shell = (inner) => `
    <div class="team-shell">
      <span class="team-badge ${badgeClass}">${badgeLabel}</span>
      ${inner}
      <div class="team-score-strip"><span>🔴 ${scores.team1}</span><span>🔵 ${scores.team2}</span></div>
    </div>`;

  if(state.phase === "lobby"){
    app.innerHTML = shell(`<div class="waiting">In attesa che l'host avvii il quiz<br><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`);
    return;
  }
  if(state.phase === "round-intro"){
    const round = ROUNDS[state.roundIdx];
    app.innerHTML = shell(`
      <div class="waiting" style="padding-top:30px;">
        <div class="team-q display" style="color:var(--text);">Round ${state.roundIdx+1}: ${round.title}</div>
        <p style="margin-top:10px;">${round.rule}</p>
        <p style="margin-top:18px; color:var(--gold);">Preparatevi, si comincia a breve...</p>
      </div>`);
    return;
  }
  if(state.phase === "question"){
    return renderTeamQuestion(state, shell);
  }
  if(state.phase === "reveal"){
    return renderTeamReveal(state, shell);
  }
  if(state.phase === "scoreboard"){
    app.innerHTML = shell(`<div class="waiting"><div class="team-q display" style="color:var(--text);">Round ${state.roundIdx+1} completato!</div><p style="margin-top:10px;">In attesa del prossimo round...</p></div>`);
    return;
  }
  if(state.phase === "end"){
    const winner = scores.team1 === scores.team2 ? "Pareggio!" : (scores.team1 > scores.team2 ? "Ha vinto la Squadra 1! 🏆" : "Ha vinto la Squadra 2! 🏆");
    app.innerHTML = shell(`<div class="waiting"><div class="team-q display" style="color:var(--gold);">Quiz terminato</div><p style="margin-top:10px; font-size:18px;">${winner}</p></div>`);
    return;
  }
}

async function renderTeamQuestion(state, shell){
  const round = ROUNDS[state.roundIdx];
  const qKeyStr = `${state.roundIdx}-${state.questionIdx}`;
  const existing = await getShared(QKEY(state.roundIdx, state.questionIdx), {});
  const alreadySubmitted = existing[ROLE] !== undefined;

  if(alreadySubmitted){
    teamInputActive = false;
    app.innerHTML = shell(`
      <div class="confirm">
        <div class="check">✅</div>
        <h3>Risposta inviata!</h3>
        <p style="color:var(--text-dim); margin-top:8px;">In attesa dell'altra squadra e dell'host...</p>
      </div>`);
    return;
  }

  teamInputActive = true;

  if(round.key === "mc"){
    const q = QUIZ.mc[state.questionIdx];
    let optsHTML = "";
    if(q.opts){
      optsHTML = `<div class="team-opts">${q.opts.map((o,i)=>`
        <label class="team-opt" data-i="${i}"><input type="radio" name="mcopt" value="${i}"><span><b>${LETTERS[i]}</b> · ${o}</span></label>`).join('')}</div>`;
    } else if(q.imgOptions){
      optsHTML = `<div class="team-opts">${q.imgOptions.map((o,i)=>`
        <label class="team-opt" data-i="${i}"><input type="radio" name="mcopt" value="${i}"><span><b>${LETTERS[i]}</b> · ${o.label}</span></label>`).join('')}</div>`;
    }
    app.innerHTML = shell(`
      <div class="team-round">Round ${state.roundIdx+1} · ${round.title}</div>
      <div class="team-q">${q.q}</div>
      ${q.img ? `<img class="team-img" id="team-mc-img">` : ''}
      ${optsHTML}
      <button class="btn btn-primary" id="submit-btn" style="margin-top:20px;" disabled>Invia risposta</button>
    `);
    if(q.img) setImgWhenReady(document.getElementById('team-mc-img'), q.img.wiki_it, q.img.wiki_en);
    let selected = null;
    app.querySelectorAll('.team-opt').forEach(el=>{
      el.onclick = ()=>{
        app.querySelectorAll('.team-opt').forEach(e=>e.classList.remove('selected'));
        el.classList.add('selected');
        el.querySelector('input').checked = true;
        selected = parseInt(el.dataset.i);
        document.getElementById('submit-btn').disabled = false;
      };
    });
    document.getElementById('submit-btn').onclick = async ()=>{
      if(selected===null) return;
      const ans = await getShared(QKEY(state.roundIdx, state.questionIdx), {});
      ans[ROLE] = selected;
      await setShared(QKEY(state.roundIdx, state.questionIdx), ans);
      teamInputActive = false; teamLastKey = ""; renderTeam(true);
    };
  } else if(round.key === "categorize"){
    app.innerHTML = shell(`
      <div class="team-round">Round ${state.roundIdx+1} · ${round.title}</div>
      <div class="team-q" style="font-size:18px;">Per ogni titolo scegli la categoria giusta</div>
      <p style="color:var(--text-dim); font-size:13px; margin-top:4px;">${QUIZ.categorize.warning}</p>
      <div id="cat-list" style="margin-top:14px;">
        ${QUIZ.categorize.items.map((it,i)=>`
          <div class="assoc-row" data-i="${i}">
            <label>${it.title}</label>
            <div style="display:flex; gap:8px; margin-top:4px;">
              <button type="button" class="cat-btn" data-i="${i}" data-choice="A" style="flex:1; padding:10px; border-radius:8px; border:2px solid var(--line); background:transparent; color:var(--text); font-size:13px; cursor:pointer;">${QUIZ.categorize.categoryA}</button>
              <button type="button" class="cat-btn" data-i="${i}" data-choice="B" style="flex:1; padding:10px; border-radius:8px; border:2px solid var(--line); background:transparent; color:var(--text); font-size:13px; cursor:pointer;">${QUIZ.categorize.categoryB}</button>
            </div>
          </div>`).join('')}
      </div>
      <button class="btn btn-primary" id="submit-btn" style="margin-top:14px;">Invia classificazione</button>
    `);
    const choices = {};
    app.querySelectorAll('.cat-btn').forEach(btn=>{
      btn.onclick = ()=>{
        const i = btn.dataset.i, choice = btn.dataset.choice;
        choices[i] = choice;
        app.querySelectorAll(`.cat-btn[data-i="${i}"]`).forEach(b=>{
          const active = b.dataset.choice === choice;
          b.style.borderColor = active ? 'var(--gold)' : 'var(--line)';
          b.style.background = active ? 'rgba(244,183,64,0.15)' : 'transparent';
        });
      };
    });
    document.getElementById('submit-btn').onclick = async ()=>{
      const map = {};
      QUIZ.categorize.items.forEach((it,i)=>{ map[i] = choices[i] || null; });
      const ans = await getShared(QKEY(state.roundIdx, state.questionIdx), {});
      ans[ROLE] = map;
      await setShared(QKEY(state.roundIdx, state.questionIdx), ans);
      teamInputActive = false; teamLastKey = ""; renderTeam(true);
    };
  } else if(round.key === "images"){
    const p = QUIZ.images[state.questionIdx];
    app.innerHTML = shell(`
      <div class="team-round">Round ${state.roundIdx+1} · ${round.title}</div>
      <div class="team-q">Che film è, e chi è questo personaggio?</div>
      <img class="team-img" id="team-hist-img">
      <label style="font-size:13px; color:var(--text-dim); display:block; margin-top:12px;">Titolo del film</label>
      <input class="team-text-input" id="text-ans-name" placeholder="Es: Il Re Leone" autocomplete="off" style="margin-top:6px;">
      <label style="font-size:13px; color:var(--text-dim); display:block; margin-top:14px;">Personaggio nell'immagine</label>
      <input class="team-text-input" id="text-ans-country" placeholder="Es: Rafiki" autocomplete="off" style="margin-top:6px;">
      <button class="btn btn-primary" id="submit-btn" style="margin-top:16px;">Invia risposta</button>
    `);
    setImgWhenReady(document.getElementById('team-hist-img'), p.wiki_it);
    document.getElementById('submit-btn').onclick = async ()=>{
      const nameVal = document.getElementById('text-ans-name').value.trim();
      const countryVal = document.getElementById('text-ans-country').value.trim();
      if(!nameVal && !countryVal) return;
      const ans = await getShared(QKEY(state.roundIdx, state.questionIdx), {});
      ans[ROLE] = { name: nameVal, country: countryVal };
      await setShared(QKEY(state.roundIdx, state.questionIdx), ans);
      teamInputActive = false; teamLastKey = ""; renderTeam(true);
    };
  }
}

async function renderTeamReveal(state, shell){
  const round = ROUNDS[state.roundIdx];
  const grade = await getShared(GKEY(state.roundIdx, state.questionIdx), {});
  const ans = await getShared(QKEY(state.roundIdx, state.questionIdx), {});
  let resultHTML = "";

  if(round.key === "mc"){
    const q = QUIZ.mc[state.questionIdx];
    const correctLabel = q.opts ? q.opts[q.correct] : q.imgOptions[q.correct].label;
    const myAns = ans[ROLE];
    const wasCorrect = myAns === q.correct;
    resultHTML = `
      <div class="confirm">
        <div class="check">${wasCorrect ? '✅' : '❌'}</div>
        <h3 style="color:${wasCorrect ? '#5fd68a' : 'var(--team1)'}">${wasCorrect ? 'Risposta corretta!' : 'Risposta sbagliata'}</h3>
        <p style="margin-top:10px; color:var(--text-dim);">La risposta giusta era: <b style="color:var(--text)">${correctLabel}</b></p>
      </div>`;
  } else if(round.key === "categorize"){
    const correctCount = grade[ROLE];
    resultHTML = `
      <div class="confirm">
        <div class="check">🎯</div>
        <h3 style="color:var(--gold)">${correctCount !== undefined ? correctCount+' / 20 corrette' : 'Nessuna risposta'}</h3>
      </div>`;
  } else if(round.key === "images"){
    const p = QUIZ.images[state.questionIdx];
    const g = grade[ROLE] || {name:null, country:null};
    const bothOk = g.name==='correct' && g.country==='correct';
    const bothWrong = g.name==='wrong' && g.country==='wrong';
    resultHTML = `
      <div class="confirm">
        <div class="check">${bothOk ? '✅' : bothWrong ? '❌' : '🤔'}</div>
        <h3 style="color:${bothOk ? '#5fd68a' : bothWrong ? 'var(--team1)' : 'var(--gold)'}">
          Film: ${g.name==='correct' ? '✔ corretto' : g.name==='wrong' ? '✘ sbagliato' : '—'} ·
          Personaggio: ${g.country==='correct' ? '✔ corretto' : g.country==='wrong' ? '✘ sbagliato' : '—'}
        </h3>
        <p style="margin-top:10px; color:var(--text-dim);">Risposta esatta: <b style="color:var(--text)">${p.name}, ${p.country}</b></p>
      </div>`;
  }

  app.innerHTML = shell(resultHTML);
}

/* ============================================================
   INIT
   ============================================================ */
async function initApp(){
  app.innerHTML = `<div class="center"><div class="waiting"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>`;
  const ok = await checkStorageAvailable();
  if(ok) renderRoleSelect();
  else renderStorageWarning();
}
initApp();
</script>
